apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plane
  namespace: plane
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-edge-gateway
      namespace: cilium-ingress

  hostnames:
    - "pm.gwg313.xyz"
    - "pm.local.gwg313.xyz"
    - "pm.zerotier.gwg313.xyz"
  rules:
    - matches:
        - path: { type: PathPrefix, value: "/api" }
        - path: { type: PathPrefix, value: "/auth" }
      backendRefs:
        - group: ""
          kind: Service
          name: plane-api
          port: 8000
          weight: 1

    - matches:
        - path: { type: PathPrefix, value: "/live/" }
      backendRefs:
        - group: ""
          kind: Service
          name: plane-live
          port: 3000
          weight: 1

    # The bare paths (no trailing slash) must be redirected by the gateway
    # itself, not left to fall through to the admin/space backends. Those
    # static nginx containers only know their own in-cluster port (3000), so
    # if they end up issuing the directory-style redirect themselves, the
    # Location header comes back as https://<host>:3000/god-mode/ instead of
    # the real public URL. Upstream's own Caddy proxy does this same
    # redirect at the edge (apps/proxy/Caddyfile.ce): `redir /god-mode
    # /god-mode/ permanent`.
    - matches:
        - path: { type: Exact, value: "/god-mode" }
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: { type: ReplaceFullPath, replaceFullPath: "/god-mode/" }
            statusCode: 301

    - matches:
        - path: { type: Exact, value: "/spaces" }
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: { type: ReplaceFullPath, replaceFullPath: "/spaces/" }
            statusCode: 301

    - matches:
        - path: { type: PathPrefix, value: "/spaces" }
      backendRefs:
        - group: ""
          kind: Service
          name: plane-space
          port: 3000
          weight: 1

    - matches:
        - path: { type: PathPrefix, value: "/god-mode" }
      backendRefs:
        - group: ""
          kind: Service
          name: plane-admin
          port: 3000
          weight: 1

    # File uploads/downloads go straight to MinIO's S3 API under the bucket
    # name (docstore_bucket in values.yaml -- "uploads"), same as upstream's
    # Caddyfile: `reverse_proxy /{$BUCKET_NAME}/* plane-minio:9000`. Without
    # this, presigned-URL PUTs (e.g. project cover images, asset uploads)
    # fall through to the catch-all "/" rule below, land on plane-web's
    # static nginx, and get "405 Not Allowed" since it only serves GET/HEAD.
    - matches:
        - path: { type: PathPrefix, value: "/uploads" }
      backendRefs:
        - group: ""
          kind: Service
          name: plane-minio
          port: 9000
          weight: 1

    - matches:
        - path: { type: PathPrefix, value: "/" }
      backendRefs:
        - group: ""
          kind: Service
          name: plane-web
          port: 3000
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-plane
  namespace: plane
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: cilium-ingress
  to:
    - group: ""
      kind: Service
      name: plane-web
    - group: ""
      kind: Service
      name: plane-api
    - group: ""
      kind: Service
      name: plane-live
    - group: ""
      kind: Service
      name: plane-space
    - group: ""
      kind: Service
      name: plane-admin
    - group: ""
      kind: Service
      name: plane-minio
