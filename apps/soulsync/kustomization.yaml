# Cluster-specific pieces of the soulsync deployment. The workloads themselves
# come from the app repo (soulsync_new k8s/overlays/prod); the Argo CD
# Application in management/platform-apps/soulsync.yaml combines both.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: soulsync

resources:
  - music-pv.yaml
  - slskd-pv.yaml
  # slskd-iscsi-auth: CHAP credentials for slskd's iSCSI LUN
  - slskd-iscsi-auth-sealed.yaml
  - serviceaccount.yaml
  - slskd-route.yaml
  # harbor-pull: read-only Harbor robot for the private soulsync project
  - harbor-pull-sealed.yaml
  # soulsync-secrets: Postgres, AcoustID, slskd/Soulseek, Navidrome credentials
  - soulsync-secrets-sealed.yaml
  # gluetun-secrets: ProtonVPN WireGuard private key
  - gluetun-secrets-sealed.yaml
