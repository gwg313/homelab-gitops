# ----------------------------------------------------
# Ingress for slskd (web UI)
# ----------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: slskd-allow-ingress
  namespace: slskd
spec:
  endpointSelector:
    matchLabels:
      app: slskd
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5030"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: soulsync
      toPorts:
        - ports:
            - port: "5030"
              protocol: TCP
---
# ----------------------------------------------------
# VPN killswitch for slskd — forces all egress through WireGuard
# ----------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vpn-killswitch
  namespace: slskd
spec:
  endpointSelector:
    matchLabels:
      app: slskd
  egress:
    - toCIDR:
        - "149.50.216.205/32"
      toPorts:
        - ports:
            - port: "51820"
              protocol: UDP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# ----------------------------------------------------
# Ingress for soulsync UI
# ----------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: soulsync-allow-ingress
  namespace: slskd
spec:
  endpointSelector:
    matchLabels:
      app: soulsync
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8008"
              protocol: TCP
---
# ----------------------------------------------------
# Egress for soulsync — unrestricted, plus internal endpoints
# ----------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: soulsync-egress
  namespace: slskd
spec:
  endpointSelector:
    matchLabels:
      app: soulsync
  egress:
    - toEntities:
        - world
    - toEndpoints:
        - matchLabels:
            app: slskd
      toPorts:
        - ports:
            - port: "5030"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: navidrome
            app: navidrome
      toPorts:
        - ports:
            - port: "4533"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
