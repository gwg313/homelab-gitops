apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # pinned to the versions the old floating URLs resolved to; bump deliberately
  - https://github.com/tektoncd/pipeline/releases/download/v1.6.0/release.yaml
  - https://github.com/tektoncd/dashboard/releases/download/v0.63.1/release.yaml
  - https://github.com/tektoncd/pipelines-as-code/releases/download/v0.51.0/release.k8s.yaml
  - namespace.yaml
  - service-account.yaml
  - tekton-runner-role.yaml
  - tekton-runner-binding.yaml
  - network-policy.yaml
  - tasks/git-clone.yaml
  - tasks/kaniko.yaml
  - pac-network-policy.yaml
  - pac-role.yaml
  - resource-limits.yaml

patches:
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: config-defaults
        namespace: tekton-pipelines
      data:
        default-timeout-minutes: "30"
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: tekton-pipelines
        labels:
          policy.home.arpa/allow-hostpath: "true"
          policy.home.arpa/platform-tier: "true"
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: tekton-pipelines-resolvers
        labels:
          policy.home.arpa/platform-tier: "true"
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: pipelines-as-code
        labels:
          policy.home.arpa/allow-hostpath: "true"
          policy.home.arpa/platform-tier: "true"
