apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cicd-egress
  namespace: cicd
spec:
  endpointSelector: {}
  # DNS (incl. the L7 rule toFQDNs needs) comes from the Kyverno-generated
  # baseline-network-security policy in every namespace
  egress:
    # Push built images to Harbor registry in-cluster
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: harbor
            app: harbor
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Git clone from internal Forgejo
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: forgejo
            app: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # kubeconform schema lookups
    - toFQDNs:
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
