# karakeep's web image has no USER directive and runs full s6-overlay
# (ENTRYPOINT ["/init"]) to supervise DB migration + web + worker processes
# -- there's no evidence (unlike karakeep-chrome, which ships USER
# 65534:65534) that it supports running rootless. Rather than guess a UID
# and risk a harder-to-diagnose s6-overlay failure, this uses the cluster's
# documented escape hatch (security.policy/allow-root) from
# platform/kyverno/policies/10-defaults/default-run-as-non-root.yaml and
# 20-require/require-non-root.yaml, which otherwise force
# runAsNonRoot=true on every pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-web
  namespace: karakeep
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karakeep-web
  template:
    metadata:
      labels:
        app: karakeep-web
        security.policy/allow-root: "true"
    spec:
      containers:
        - name: web
          image: ghcr.io/karakeep-app/karakeep:0.33.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: MEILI_ADDR
              value: http://karakeep-meilisearch:7700
            - name: BROWSER_WEB_URL
              value: http://karakeep-chrome:9222
            - name: DATA_DIR
              value: /data
            # Add OPENAI_API_KEY to the ConfigMap if AI tagging is wanted
          envFrom:
            - secretRef:
                name: karakeep-secrets
            - configMapRef:
                name: karakeep-configuration
          volumeMounts:
            - mountPath: /data
              name: data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karakeep-data
