apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: harbor-intra-namespace-allow
  namespace: harbor
spec:
  description: "Allow all internal Harbor microservices to talk to each other cleanly"
  endpointSelector:
    matchLabels:
      app: harbor
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: harbor
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: harbor
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress
  namespace: harbor
spec:
  description: "Allow external traffic from the shared Cilium edge proxy into the harbor namespace services"
  endpointSelector:
    matchLabels: {}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    # CI image builds (ci/charts/ci-project build-* namespaces). They reach
    # registry.gwg313.xyz through the shared gateway, but Cilium enforces
    # this policy against the original pod, not the gateway.
    # build namespaces push images; pipeline namespaces only check whether a
    # tag exists (content-tag)
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.ci.home.arpa/role: build
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.ci.home.arpa/role: pipeline
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# Proxy-cache project `dockerhub`: harbor-core fetches from Docker Hub on a
# cache miss (and checks the endpoint via hub.docker.com); jobservice runs
# replication/preheat jobs against the same endpoint.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-upstream-registries
  namespace: harbor
spec:
  endpointSelector:
    matchExpressions:
      - key: component
        operator: In
        values: [core, jobservice]
  egress:
    - toFQDNs:
        - matchName: hub.docker.com
        - matchName: index.docker.io
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchName: production.cloudflare.docker.com
        - matchName: production.cloudfront.docker.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
