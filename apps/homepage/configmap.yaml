apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab
    theme: dark

  services.yaml: |
    - Media:
        - Audiobookshelf:
            href: https://audiobooks.gwg313.xyz
            description: Audiobook and podcast server
        - Navidrome:
            href: https://music.gwg313.xyz
            description: Music streaming server

    - Productivity:
        - Plane:
            href: https://pm.gwg313.xyz
            description: Project management
        - Vikunja:
            href: https://todo.gwg313.xyz
            description: Task management
        - Bytestash:
            href: https://snippets.gwg313.xyz
            description: Code snippet manager
        - Yopass:
            href: https://pastebin.gwg313.xyz
            description: Secure secret sharing
        - Karakeep:
            href: https://bookmarks.gwg313.xyz
            description: Bookmark manager
        - Stirling PDF:
            href: https://pdftools.gwg313.xyz
            description: PDF toolkit

    - Dev / Infra:
        - Forgejo:
            href: https://git.gwg313.xyz
            description: Self-hosted git
        - Harbor:
            href: https://registry.gwg313.xyz
            description: Container registry
        - IT Tools:
            href: https://tools.gwg313.xyz
            description: Handy developer utilities

    - Home:
        - Homebox:
            href: https://inventory.gwg313.xyz
            description: Home inventory and asset management
        - Mealie:
            href: https://recipes.gwg313.xyz
            description: Recipe manager and meal planner

  widgets.yaml: |
    []

  bookmarks.yaml: |
    []

  docker.yaml: |
    {}

  kubernetes.yaml: |
    {}
