kyverno:
  # Keep Kyverno's own etcd write load down: admission reports create an
  # object per admission request, and frequent background rescans rewrite
  # every report. Enforcement doesn't depend on either; audit results still
  # come from the (less frequent) background scan.
  features:
    admissionReports:
      enabled: false
    backgroundScan:
      backgroundScanInterval: 12h
    # PolicyViolation events from background scans (one per non-compliant
    # resource, re-sent on every controller restart) flooded etcd with
    # 160k+ events; violations stay visible in the policy reports.
    omitEvents:
      eventTypes:
        - PolicyApplied
        - PolicySkipped
        - PolicyViolation

  backgroundController:
    resources:
      limits:
        memory: 256Mi

  reportsController:
    resources:
      limits:
        memory: 256Mi

  # Its informers cache every resource kind the TTL/cleanup policies touch;
  # the 128Mi chart default OOMs on this cluster.
  cleanupController:
    resources:
      limits:
        memory: 256Mi

  admissionController:
    replicas: 2
    features:
      loggingFormat: text
      policyExceptions:
        enabled: true
    telemetry:
      enabled: false
