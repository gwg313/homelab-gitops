apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # bump deliberately; Shipwright pins the Tekton minor it is built against
  - https://github.com/tektoncd/pipeline/releases/download/v1.15.3/release.yaml
  - https://github.com/tektoncd/dashboard/releases/download/v0.73.0/release.yaml
  - https://github.com/tektoncd/pipelines-as-code/releases/download/v0.51.0/release.k8s.yaml
  - pac-network-policy.yaml

patches:
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: config-defaults
        namespace: tekton-pipelines
      data:
        default-timeout-minutes: "30"
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: tekton-pipelines
        labels:
          policy.home.arpa/allow-hostpath: "true"
          policy.home.arpa/platform-tier: "true"
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: tekton-pipelines-resolvers
        labels:
          policy.home.arpa/platform-tier: "true"
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: pipelines-as-code
        labels:
          policy.home.arpa/allow-hostpath: "true"
          policy.home.arpa/platform-tier: "true"
  # only resolve Tasks from the shared catalog
  # so one project can't pull Tasks out of another project's namespace
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cluster-resolver-config
        namespace: tekton-pipelines-resolvers
      data:
        allowed-namespaces: "tekton-catalog"
