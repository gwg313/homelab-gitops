# Watches Harbor for new image tags and writes them back to this repo
# (configured per project with ImageUpdater resources). CI itself gets no
# write access to homelab-gitops.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - https://raw.githubusercontent.com/argoproj-labs/argocd-image-updater/v1.3.1/config/install.yaml

patches:
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-image-updater-config
      data:
        log.level: info
        # Harbor pull-only robot account, as a dockerconfigjson Secret
        # (SealedSecret) named harbor-image-updater in argocd
        registries.conf: |
          registries:
            - name: Harbor
              api_url: https://registry.gwg313.xyz
              prefix: registry.gwg313.xyz
              credentials: pullsecret:argocd/harbor-image-updater
              credsexpire: 6h
