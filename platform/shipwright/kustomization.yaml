apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # v0.21 is built against Tekton Pipelines v1.15 (platform/tekton)
  - https://github.com/shipwright-io/build/releases/download/v0.21.7/release.yaml
  - webhook-cert.yaml
  - buildah-chroot.yaml

patches:
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: shipwright-build
        labels:
          policy.home.arpa/platform-tier: "true"
  - target:
      kind: CustomResourceDefinition
      name: ".*\\.shipwright\\.io"
    patch: |
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: any
        annotations:
          cert-manager.io/inject-ca-from: shipwright-build/shipwright-build-webhook-cert
