# Dockerfile builds with kaniko, without privileged mode.
# buildah needs CAP_SYS_ADMIN or user namespaces for RUN steps, and PSA
# baseline plus the RuntimeDefault seccomp profile allow neither. kaniko runs
# RUN steps directly in its own container filesystem: root with a small
# capability set, no privilege escalation, RuntimeDefault seccomp. It unpacks
# base images into /, so the root fs stays writable. Build namespaces must
# allow root and extra capabilities (policy.home.arpa/allow-root,
# policy.home.arpa/allow-any-capabilities).
#
# kaniko writes an image tarball; Shipwright's image-processing step pushes it
# with the build's push secret (the same path the ko strategy uses).
#
# Docker Hub base images come through Harbor's `dockerhub` proxy-cache project
# (--registry-map), so build namespaces need no Docker Hub egress. Dockerfiles
# keep their plain docker.io references.
#
# gcr.io/kaniko-project was archived in 2025; osscontainertools/kaniko is the
# maintained fork. The -debug variant ships the busybox shell used below.
apiVersion: shipwright.io/v1beta1
kind: ClusterBuildStrategy
metadata:
  name: kaniko
  annotations:
    # apply only after the conversion webhook (wave 0) is healthy; creating a
    # Shipwright object while the webhook is unreachable sends the API servers
    # into a conversion-retry storm
    argocd.argoproj.io/sync-wave: "1"
spec:
  parameters:
    - name: dockerfile
      description: Path to the Dockerfile, relative to the context directory.
      default: Dockerfile
    - name: build-args
      description: Build arguments as KEY=VALUE.
      type: array
      defaults: []
    - name: target
      description: Target stage of a multi-stage Dockerfile.
      default: ""
  steps:
    - name: build
      image: ghcr.io/osscontainertools/kaniko:v1.28.5-debug@sha256:d6d74217dc077acfd3094992e917c357080a2d3fdd1042a49e34e29a7e57c572
      # source root, not the context: Tekton pre-creates a step's workingDir,
      # and a subdirectory inside the empty source volume makes the git clone
      # fail with "destination path ... is not an empty directory"
      workingDir: $(params.shp-source-root)
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: [ALL]
          add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - FSETID
            - KILL
            - SETFCAP
            - SETGID
            - SETUID
      env:
        - name: HOME
          value: /tekton/home
        - name: DOCKER_CONFIG
          value: /tekton/home/.docker
        - name: DOCKERFILE
          value: $(params.dockerfile)
        - name: TARGET
          value: $(params.target)
        - name: IMAGE
          value: $(params.shp-output-image)
        - name: CONTEXT
          value: $(params.shp-source-context)
        - name: OUTPUT_DIR
          value: $(params.shp-output-directory)
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
      command: [/busybox/sh]
      args:
        - -c
        - |
          set -eu
          if [ ! -f "$CONTEXT/$DOCKERFILE" ]; then
            echo "Dockerfile '$DOCKERFILE' not found"
            printf DockerfileNotFound > '$(results.shp-error-reason.path)'
            printf "Dockerfile '%s' not found" "$DOCKERFILE" > '$(results.shp-error-message.path)'
            exit 1
          fi
          # build args arrive as positional parameters; rewrite each in place
          # to --build-arg=KEY=VALUE (rotating through "$@" keeps quoting intact)
          n=$#
          while [ "$n" -gt 0 ]; do
            set -- "$@" "--build-arg=$1"
            shift
            n=$((n - 1))
          done
          [ -n "$TARGET" ] && set -- "$@" "--target=$TARGET"
          exec /kaniko/executor \
            --context="dir://$CONTEXT" \
            --dockerfile="$CONTEXT/$DOCKERFILE" \
            --destination="$IMAGE" \
            --no-push \
            --tar-path="$OUTPUT_DIR/image.tar" \
            --snapshot-mode=redo \
            --ignore-path=/product_uuid \
            --registry-map=index.docker.io=registry.gwg313.xyz/dockerhub \
            "$@"
        - --
        - $(params.build-args[*])
