kube-prometheus-stack:
  grafana:
    defaultDashboardsTimezone: browser
    grafana.ini:
      date_formats:
        default_timezone: browser
    admin:
      existingSecret: kube-prometheus-stack-grafana
      userKey: admin-user
      passwordKey: admin-password

  alertmanager:
    enabled: true

    alertmanagerSpec:
      # The operator (v0.90) rejects Discord's webhook_url_file in a raw
      # config, so the config is an AlertmanagerConfig instead
      # (templates/alertmanager-config.yaml), which reads the webhook URL from
      # a secret.
      alertmanagerConfiguration:
        name: alertmanager-main
        templates:
          - configMap:
              name: alertmanager-templates
              key: discord.tmpl

  # Cilium replaces kube-proxy, so there is nothing to scrape and
  # KubeProxyDown would fire forever.
  kubeProxy:
    enabled: false

  prometheus:
    prometheusSpec:
      # Without explicit resources the Kyverno defaults (200m / 512Mi) applied,
      # WAL replay never finished inside the startup probe window and
      # Prometheus restart-looped for weeks, saturating shared VM storage.
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
      retention: 7d
      retentionSize: 4GB

  prometheus-node-exporter:
    podLabels:
      policy.home.arpa/allow-host-namespace: "true"
