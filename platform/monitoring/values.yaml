kube-prometheus-stack:
  grafana:
    defaultDashboardsTimezone: browser
    grafana.ini:
      date_formats:
        default_timezone: browser
    admin:
      existingSecret: kube-prometheus-stack-grafana
      userKey: admin-user
      passwordKey: admin-password

  alertmanager:
    enabled: true

    alertmanagerSpec:
      # Mounted at /etc/alertmanager/secrets/<name>/<key>. Only the webhook
      # URL is secret; the routing and templates below live in plain values.
      secrets:
        - alertmanager-discord-webhook

    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['alertname', 'namespace']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: discord
        routes:
          # Watchdog is the always-firing dead man's switch and InfoInhibitor
          # exists only to drive the inhibit rule below; neither is actionable.
          - matchers:
              - alertname =~ "Watchdog|InfoInhibitor"
            receiver: 'null'
          - matchers:
              - severity = critical
            receiver: discord-critical
      inhibit_rules:
        # Same rules the chart ships by default. Info alerts such as
        # CPUThrottlingHigh only get through when something worse is already
        # firing in the same namespace.
        - source_matchers:
            - severity = critical
          target_matchers:
            - severity =~ warning|info
          equal: [namespace, alertname]
        - source_matchers:
            - severity = warning
          target_matchers:
            - severity = info
          equal: [namespace, alertname]
        - source_matchers:
            - alertname = InfoInhibitor
          target_matchers:
            - severity = info
          equal: [namespace]
        - target_matchers:
            - alertname = InfoInhibitor
      receivers:
        - name: 'null'
        - name: discord
          discord_configs:
            - send_resolved: true
              webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/url
              title: '{{ template "discord.title" . }}'
              message: '{{ template "discord.message" . }}'
        # Same channel, but pings @here so critical alerts stand out from
        # warnings.
        - name: discord-critical
          discord_configs:
            - send_resolved: true
              webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/url
              content: '{{ if eq .Status "firing" }}@here{{ end }}'
              title: '{{ template "discord.title" . }}'
              message: '{{ template "discord.message" . }}'
      templates:
        - /etc/alertmanager/config/*.tmpl

    templateFiles:
      discord.tmpl: |-
        {{ define "discord.title" -}}
        [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} in {{ . }}{{ end }}
        {{- end }}

        {{ define "discord.message" -}}
        {{ range .Alerts -}}
        {{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} **{{ .Labels.alertname }}**{{ with .Labels.severity }} ({{ . }}){{ end }}
        {{ with .Annotations.description }}{{ . }}{{ else }}{{ .Annotations.summary }}{{ end }}
        {{ range .Labels.SortedPairs }}{{ if not (eq .Name "alertname" "severity" "prometheus") }}`{{ .Name }}={{ .Value }}` {{ end }}{{ end }}
        {{ if eq .Status "firing" }}Since <t:{{ .StartsAt.Unix }}:R>{{ else }}Resolved <t:{{ .EndsAt.Unix }}:R>{{ end }}{{ with .Annotations.runbook_url }} · [runbook]({{ . }}){{ end }}

        {{ end }}
        {{- end }}

  prometheus:
    prometheusSpec:
      # Without explicit resources the Kyverno defaults (200m / 512Mi) applied,
      # WAL replay never finished inside the startup probe window and
      # Prometheus restart-looped for weeks, saturating shared VM storage.
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
      retention: 7d
      retentionSize: 4GB

  prometheus-node-exporter:
    podLabels:
      policy.home.arpa/allow-host-namespace: "true"
