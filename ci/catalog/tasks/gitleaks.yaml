apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitleaks
  namespace: tekton-catalog
spec:
  description: Scan the source workspace for committed secrets with gitleaks.
  workspaces:
    - name: source
  steps:
    - name: gitleaks
      image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      command: [gitleaks]
      args: [detect, --no-git, -v, --redact, --source=.]
