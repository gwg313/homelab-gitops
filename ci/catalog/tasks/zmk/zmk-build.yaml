apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: zmk-build
  namespace: tekton-catalog
spec:
  description: >-
    Build ZMK firmware for one board/shield of a zmk-config repository and copy
    the .uf2 to an output directory in the workspace. The image must contain
    the west workspace (ZMK, Zephyr, modules) at /zmk with ZEPHYR_BASE set, e.g.
    zmk-build-arm plus `west init -l config && west update` from the config's
    west.yml (see content-tag for rebuilding it only when west.yml changes).
    Run it in a matrix for several halves or keyboards; each writes
    <shield>-<board>.uf2.
  workspaces:
    - name: source
  params:
    - name: image
      type: string
      description: Image with the west workspace at /zmk.
    - name: board
      type: string
      description: Zephyr board, e.g. nice_nano_v2.
    - name: shield
      type: string
      description: ZMK shield, e.g. corne_left. Empty for boards without a shield.
      default: ""
    - name: config-dir
      type: string
      description: The zmk-config directory (keymaps, .conf, boards/), relative to the workspace.
      default: config
    - name: output-dir
      type: string
      description: Directory the .uf2 is copied to, relative to the workspace.
      default: firmware
    - name: cmake-args
      type: array
      description: Extra CMake arguments, e.g. -DCONFIG_ZMK_STUDIO=y.
      default: []
  volumes:
    - name: tmp
      emptyDir: {}
  steps:
    - name: build
      image: $(params.image)
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      computeResources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1536Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      env:
        - name: HOME
          value: /tmp
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: CCACHE_DISABLE
          value: "1"
        # the west workspace in the image belongs to root; let git read it
        # (Zephyr runs git describe for version info)
        - name: GIT_CONFIG_COUNT
          value: "1"
        - name: GIT_CONFIG_KEY_0
          value: safe.directory
        - name: GIT_CONFIG_VALUE_0
          value: "*"
        - name: BOARD
          value: $(params.board)
        - name: SHIELD
          value: $(params.shield)
        - name: CONFIG_DIR
          value: $(workspaces.source.path)/$(params.config-dir)
        - name: OUTPUT_DIR
          value: $(workspaces.source.path)/$(params.output-dir)
      args: ["$(params.cmake-args[*])"]
      script: |
        #!/bin/sh
        set -eu
        name="${SHIELD:+$SHIELD-}$BOARD"
        echo "::: building $name"
        # west finds its workspace from the current directory; the build
        # directory goes to the pod-local volume (the image is read-only)
        cd /zmk
        # west records zephyr.base in the workspace config on first use; the
        # image is read-only here, so use a writable copy
        cp .west/config /tmp/west-config
        export WEST_CONFIG_LOCAL=/tmp/west-config
        # point CMake at Zephyr directly instead of relying on west
        # zephyr-export, whose package registry lives under $HOME
        zephyr_base=${ZEPHYR_BASE:-/zmk/zephyr}
        west build -p always -s zmk/app -d /tmp/build -b "$BOARD" -- \
          -DZephyr_DIR="$zephyr_base/share/zephyr-package/cmake" \
          ${SHIELD:+-DSHIELD="$SHIELD"} -DZMK_CONFIG="$CONFIG_DIR" "$@"
        mkdir -p "$OUTPUT_DIR"
        cp /tmp/build/zephyr/zmk.uf2 "$OUTPUT_DIR/$name.uf2"
        ls -l "$OUTPUT_DIR/$name.uf2"
