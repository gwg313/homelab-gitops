apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: zmk-west-update
  namespace: tekton-catalog
spec:
  description: >-
    Set up the west workspace for a zmk-config repository: west init from the
    config directory's west.yml, then west update (ZMK, Zephyr, modules) into
    the workspace, as ZMK's own build workflow does. Run it once before the
    zmk-build tasks, which reuse the checkout. Needs egress to github.com.
  workspaces:
    - name: source
  params:
    - name: config-dir
      type: string
      description: The zmk-config directory containing west.yml, relative to the workspace.
      default: config
    - name: image
      type: string
      description: >-
        ZMK build image; its Zephyr SDK must match the Zephyr version west.yml
        pulls in (zmk-build-arm:3.5 for ZMK v0.3).
      default: docker.io/zmkfirmware/zmk-build-arm:3.5@sha256:0979a8de325e3d822e48bd8d1d9efaee2984ad3750253119f920a342f0ce5cde
  volumes:
    - name: tmp
      emptyDir: {}
  steps:
    - name: west-update
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      computeResources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      env:
        - name: HOME
          value: /tmp
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: CONFIG_DIR
          value: $(params.config-dir)
      script: |
        #!/bin/sh
        set -eu
        west init -l "$CONFIG_DIR"
        # blobless clones, like ZMK's build-user-config workflow
        west update --fetch-opt=--filter=tree:0
        west list
