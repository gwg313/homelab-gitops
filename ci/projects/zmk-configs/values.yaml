# CI for the ZMK keyboard configs: build every board/shield and publish the
# .uf2 files as one zip in Forgejo's generic package registry. The ZMK/Zephyr
# west workspace is baked into an image (registry.gwg313.xyz/zmk/zmk-west,
# tagged by the hash of west.yml + Containerfile), rebuilt only when those
# change; firmware builds then need no network.
name: zmk-configs

repository:
  url: https://git.gwg313.xyz/gwg313/zmk-configs
  provider: forgejo
  secretName: pac-git-token

build:
  enabled: true
  # robot with push rights on the public Harbor project "zmk"
  pushSecret: harbor-push

# image build only: west update from GitHub (the Docker Hub base image comes
# through Harbor's dockerhub proxy cache)
egressFQDNs:
  - github.com
