# Default SA for PipelineRuns (set taskRunTemplate.serviceAccountName: pipeline);
# no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  namespace: {{ include "ci-project.ciNamespace" . }}
  labels:
    {{- include "ci-project.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.build.enabled }}
---
# Only for the shipwright-build task (taskRunSpecs): may create BuildRuns in
# build-<name>, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-trigger
  namespace: {{ include "ci-project.ciNamespace" . }}
  labels:
    {{- include "ci-project.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# Runs the builds. Secrets are pre-linked so Shipwright doesn't patch the SA
# (which Argo CD would then revert).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: builder
  namespace: {{ include "ci-project.buildNamespace" . }}
  labels:
    {{- include "ci-project.labels" . | nindent 4 }}
automountServiceAccountToken: false
secrets:
  - name: {{ .Values.build.pushSecret }}
  {{- with .Values.build.cloneSecret }}
  - name: {{ . }}
  {{- end }}
{{- end }}
