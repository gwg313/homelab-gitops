apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "ci-project.ciNamespace" . }}
  labels:
    {{- include "ci-project.labels" . | nindent 4 }}
    ci.home.arpa/role: pipeline
{{- if .Values.build.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "ci-project.buildNamespace" . }}
  labels:
    {{- include "ci-project.labels" . | nindent 4 }}
    ci.home.arpa/role: build
    # kaniko runs as root with the PSA-baseline capability set
    policy.home.arpa/allow-root: "true"
    policy.home.arpa/allow-any-capabilities: "true"
{{- end }}
