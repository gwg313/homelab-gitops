apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-pipelines
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/gwg313/homelab-gitops.git
    targetRevision: main
    path: platform/tekton
  destination:
    server: https://kubernetes.default.svc
  # Tekton's webhook injects its conversion config (service, CA bundle) into
  # its CRDs and fills in defaults on Tasks. Ignore those fields so the app
  # isn't permanently OutOfSync and syncs never strip the injected CA bundle.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig
        - .spec.preserveUnknownFields
    - group: tekton.dev
      kind: Task
      jqPathExpressions:
        - .spec.params[]?.type
        - .spec.results[]?.type
        - .spec.steps[]?.computeResources
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
