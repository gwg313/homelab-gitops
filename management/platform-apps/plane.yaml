apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/gwg313/homelab-gitops.git
    targetRevision: main
    path: apps/plane
  destination:
    server: https://kubernetes.default.svc
    namespace: plane
  # The chart's migrate Job is mutated by Kyverno after creation; with
  # Replace=true Argo then tries to replace it, which Jobs never allow, and
  # the sync retries forever. The Job only needs to exist once.
  ignoreDifferences:
    - group: batch
      kind: Job
      jqPathExpressions:
        - .spec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - RespectIgnoreDifferences=true
