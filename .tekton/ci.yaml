---
# CI for this repository (namespace ci-homelab-gitops, see ci/projects/homelab-gitops).
# Every task comes from the shared catalog in tekton-catalog.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: homelab-ci
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request, push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  taskRunTemplate:
    serviceAccountName: pipeline
    podTemplate:
      securityContext:
        # matches git-clone's uid so every step can read the workspace
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
  params:
    - name: revision
      value: "{{ revision }}"
    # clone from in-cluster Forgejo; the pipeline has no route to the public URL
    - name: clone_url
      value: "http://forgejo.forgejo.svc.cluster.local/gwg313/homelab-gitops"
  pipelineSpec:
    params:
      - name: revision
        type: string
      - name: clone_url
        type: string
    workspaces:
      - name: source
    tasks:
      - name: clone
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: namespace, value: tekton-catalog}
            - {name: name, value: git-clone}
        params:
          - {name: url, value: $(params.clone_url)}
          - {name: revision, value: $(params.revision)}
        workspaces:
          - {name: output, workspace: source}

      - name: lint-yaml
        runAfter: [clone]
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: namespace, value: tekton-catalog}
            - {name: name, value: yamllint}
        workspaces:
          - {name: source, workspace: source}

      - name: validate
        runAfter: [clone]
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: namespace, value: tekton-catalog}
            - {name: name, value: kubeconform}
        params:
          - {name: exclude-names, value: "Taskfile.yaml devenv.yaml application-controller-resources.yaml"}
        workspaces:
          - {name: source, workspace: source}

      - name: render-kustomize
        runAfter: [clone]
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: namespace, value: tekton-catalog}
            - {name: name, value: kustomize-build}
        workspaces:
          - {name: source, workspace: source}

      - name: render-helm
        runAfter: [clone]
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: namespace, value: tekton-catalog}
            - {name: name, value: helm-template}
        workspaces:
          - {name: source, workspace: source}

      - name: scan-secrets
        runAfter: [clone]
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: namespace, value: tekton-catalog}
            - {name: name, value: gitleaks}
        workspaces:
          - {name: source, workspace: source}
