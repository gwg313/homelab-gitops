---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: homelab-ci
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request, push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  taskRunTemplate:
    serviceAccountName: tekton-runner
    podTemplate:
      securityContext:
        # matches git-clone's uid so every step can read the workspace
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: clone_url
      value: "http://forgejo.forgejo.svc.cluster.local/gwg313/homelab-gitops"
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
      - name: clone_url
        type: string
    workspaces:
      - name: source
    tasks:
      - name: clone
        params:
          - name: url
            value: $(params.clone_url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: output
            workspace: source
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: git-clone
            - name: namespace
              value: cicd

      - name: lint-yaml
        runAfter: [clone]
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: yamllint
              image: docker.io/pipelinecomponents/yamllint:0.35.13@sha256:5ab5eb7da0ed5e606b07c1723fc8b275e925189f70ac259b26b7329cb5f8f44d
              workingDir: $(workspaces.source.path)
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              command: [yamllint]
              args: [.]

      - name: validate
        runAfter: [clone]
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: kubeconform
              image: ghcr.io/yannh/kubeconform:v0.8.0-alpine@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f
              workingDir: $(workspaces.source.path)
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              script: |
                #!/bin/sh
                set -e
                SCHEMA='https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/{{.ResourceKind}}-{{.ResourceAPIVersion}}.json'
                # skip Helm chart metadata/values/templates and tool configs (not manifests)
                find . \( -path ./.git -o -path '*/templates' \) -prune -o -type f \
                  \( -name '*.yaml' -o -name '*.yml' \) \
                  ! -name Chart.yaml ! -name 'values*.yaml' ! -name Taskfile.yaml ! -name devenv.yaml -print \
                  | xargs /kubeconform \
                    -strict \
                    -summary \
                    -ignore-missing-schemas \
                    -schema-location "$SCHEMA" \
                    -schema-location default

      - name: scan-secrets
        runAfter: [clone]
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: gitleaks
              image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
              workingDir: $(workspaces.source.path)
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              command: [gitleaks]
              args: [detect, --no-git, -v, --redact, --source=.]
